<!DOCTYPE html><body style="margin:4px;background:#fff">
<style>div{display:inline-block;width:40px;height:30px;margin:12px;background:#fff;vertical-align:top}</style>
<div style="box-shadow:3px 3px 0 #333"></div>
<div style="box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>
<div style="box-shadow:0 0 0 3px #36c;border-radius:8px"></div>
<div style="box-shadow:0 6px 10px -3px #000;border-radius:6px"></div>
<div style="box-shadow:inset 0 0 6px #000"></div>
<div style="box-shadow:inset 4px 4px 0 #c33,2px 2px 3px #393;border:3px solid #999;border-radius:10px"></div>
<div style="color:#c0c;box-shadow:4px 4px 1px;border-radius:15px"></div>
<div style="background:rgba(255,0,0,.2);box-shadow:0 0 8px 2px #000"></div>
</body>
