<!DOCTYPE html>
<!-- Form controls as browsers size and draw them: a text field by its
     size, selects by their options, a list box, buttons, a range, a
     color, a file, progress and meter; the thin ring of the controls a
     page does not style, the page's own borders kept -->
<body style="margin:4px;font:10px DejaVu Sans">
<input size=8 value=ab> <select><option>Medium</option><option>Longer option</option></select> <select><option>x</option></select> <button>Go</button> <input type=submit value=Send><br>
<select multiple size=3><option>one<option>two<option>three<option>four</select> <textarea rows=2 cols=10>ta</textarea> <input type=checkbox checked> <input type=radio><br>
<input type=range value=20 max=40> <input type=color value="#ff8800"> <progress value=30 max=40></progress> <meter value=.6></meter><br>
<input type=file><br>
<input size=6 style="border:1px solid red" value=own> <button style="border:2px solid blue;border-radius:8px">own</button> <input size=4 style="border-color:green">
