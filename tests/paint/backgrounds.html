<!DOCTYPE html>
<!-- Background layers: gradients sized, placed and repeated as images
     are; repeating and conic gradients, radial shapes, sizes and
     centres, color hints, two-position stops; positions of one to four
     values; sizes with units; origin and clip boxes; space and round -->
<style>body{margin:4px;font:10px DejaVu Sans}
div{width:72px;height:36px;margin:2px;display:inline-block;border:1px solid #000}
.i{background-image:url(img/dot.gif);background-repeat:no-repeat;background-color:#eee}
</style>
<div style="background:linear-gradient(red,blue) no-repeat 10px 10px/50px 20px"></div>
<div style="background:linear-gradient(90deg,red 50%,transparent 50%) 0 0/12px 12px"></div>
<div style="background:radial-gradient(circle,yellow,green) center/30px 30px no-repeat #ccc"></div>
<div style="background:linear-gradient(to right,#000 1px,transparent 1px),linear-gradient(#000 1px,transparent 1px);background-size:1em 1em"></div>
<div style="background:repeating-linear-gradient(45deg,#fa0 0 8px,#333 8px 16px)"></div>
<div style="background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)"></div>
<div style="background:linear-gradient(red,red) right 10px bottom 5px/20px 20px no-repeat"></div>
<div style="background:linear-gradient(to right,red,orange,yellow,green);background-size:100% 4px;background-repeat:no-repeat;background-position:bottom"></div>
<div style="background:radial-gradient(ellipse at top left,red,transparent 70%),#226"></div>
<div style="background:linear-gradient(to right,red 20px,30px,blue 60px)"></div>
<div style="background:repeating-radial-gradient(circle at 20px 20px,#fff 0 4px,#08c 4px 8px)"></div>
<div style="background:linear-gradient(to bottom right,red 50%,blue 50%)"></div>
<div style="background:radial-gradient(closest-side,red,blue)"></div>
<div style="background:radial-gradient(20px 10px at 30% 30%,red,blue)"></div>
<div style="background:conic-gradient(from 90deg at 25% 50%,#000 25%,#fff 0 50%,#888 0)"></div>
<div style="background:linear-gradient(transparent,red)"></div>
<div class=i style="background-position:top right"></div>
<div class=i style="background-position:right 10px bottom 4px"></div>
<div class=i style="background-position:center;background-size:2em 2em"></div>
<div class=i style="background-position:50% 100%;background-size:auto 1em"></div>
<div class=i style="background-repeat:space"></div>
<div class=i style="background-repeat:round"></div>
<div class=i style="background-position:calc(100% - 4px) 4px"></div>
<div class=i style="background-repeat:repeat-y;background-position:right"></div>
<div style="border:6px dashed #0008;padding:6px;background:#fc0 linear-gradient(red,blue) no-repeat;background-origin:content-box;background-clip:padding-box"></div>
<div style="border:6px dashed #0008;padding:6px;background:#fc0;background-clip:content-box"></div>
<div style="border:6px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,red,blue) border-box;border-radius:10px"></div>
