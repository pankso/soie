<!DOCTYPE html><body style="margin:4px;background:#fff">
<style>.c{display:inline-block;vertical-align:top;margin:4px;width:90px;height:50px;background:#36c}</style>
<div class="c" style="border-radius:40px / 15px"></div>
<div class="c" style="border-radius:10px 30px / 30px 10px"></div>
<div class="c" style="border-radius:50% / 20%"></div>
<div class="c" style="border-radius:0 / 20px;background:#c33"></div>
<div class="c" style="border-top-left-radius:50px 20px;border-bottom-right-radius:20px 50%"></div>
<div class="c" style="border-radius:20px 40px 10px / 10px;border:5px solid #333;background:#fc6;width:80px;height:40px"></div>
<div class="c" style="border-radius:90px / 10px;overflow:hidden;background:#eee"><p style="margin:0;height:50px;background:#3a3;width:45px"></p></div>
