<!DOCTYPE html>
<!-- SVG paint servers and text: linear and radial gradients (bounding box
     and user space units, gradientTransform, spreadMethod, href to the
     stops of another, focal point), a gradient stroke, url() fallback
     colors, <text> with <tspan>, text-anchor and font-size -->
<style>body{margin:8px} svg{margin:2px}</style>
<svg width="64" height="43" viewBox="0 0 120 80"><defs><linearGradient id="a"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient></defs><rect x="10" y="10" width="100" height="60" fill="url(#a)"/></svg>
<svg width="64" height="43" viewBox="0 0 120 80"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="20%" style="stop-color:#0a0"/><stop offset="80%" stop-color="#ff0" stop-opacity="0.2"/></linearGradient></defs><rect x="10" y="10" width="100" height="60" rx="10" fill="url(#b)" stroke="#000"/></svg>
<svg width="64" height="43" viewBox="0 0 120 80"><defs><radialGradient id="c"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#036"/></radialGradient></defs><circle cx="60" cy="40" r="35" fill="url(#c)"/></svg>
<svg width="64" height="43" viewBox="0 0 120 80"><defs><radialGradient id="d" cx="30%" cy="30%" fx="20%" fy="20%" r="60%" spreadMethod="reflect"><stop offset="0" stop-color="orange"/><stop offset="0.5" stop-color="purple"/></radialGradient></defs><rect x="10" y="10" width="100" height="60" fill="url(#d)"/></svg>
<svg width="64" height="43" viewBox="0 0 120 80"><defs><linearGradient id="e" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="30" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#ccc"/></linearGradient><linearGradient id="f" href="#e" gradientTransform="rotate(45)"/></defs><rect x="10" y="10" width="100" height="25" fill="url(#e)"/><rect x="10" y="45" width="100" height="25" fill="url(#f)"/></svg>
<svg width="64" height="43" viewBox="0 0 120 80"><defs><linearGradient id="h"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="lime"/></linearGradient></defs><path d="M10 40 C40 0 80 80 110 40" fill="none" stroke="url(#h)" stroke-width="10"/><rect x="10" y="60" width="40" height="15" fill="url(#nothere) #36c"/><rect x="60" y="60" width="40" height="15" fill="url(#nothere)"/></svg>
<svg width="140" height="63" viewBox="0 0 200 90"><text x="100" y="20" text-anchor="middle" font-size="16">Middle text</text><text x="190" y="45" text-anchor="end" fill="#c33" font-weight="bold">End <tspan fill="#36c">blue</tspan> part</text><text x="10" y="75" font-size="20">Big <tspan dy="-6" font-size="12">sup</tspan></text></svg>
<svg width="140" height="63" viewBox="0 0 100 45"><text x="5" y="20">Scaled 2x</text><g transform="translate(5 40)"><text>
   spaced    words  </text></g></svg>
