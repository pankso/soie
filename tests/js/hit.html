<!DOCTYPE html>
<!-- The element under a point follows the paint order: z-index, then the
     tree; a fixed dialog in an inline element over a later backdrop -->
<div id=app style="position:absolute;top:0;left:0;width:400px">
 <span><div id=dlg style="position:fixed;top:50px;left:50px;width:200px;height:100px;background:red;z-index:2202"><button id=btn style="margin:20px">B</button></div></span>
</div>
<div id=bd style="position:fixed;top:0;left:0;width:400px;height:300px;background:rgba(0,0,0,.5);z-index:2201"></div>
<div id=hidden style="position:fixed;top:200px;left:0;width:100px;height:100px;z-index:3000;visibility:hidden"><span id=shown style="visibility:visible;width:20px;height:20px;display:block"></span></div>
<div id=ghost style="position:fixed;top:200px;left:150px;width:100px;height:100px;z-index:3000;pointer-events:none"><span id=back style="pointer-events:auto;width:20px;height:20px;display:block"></span></div>
<div id=head style="position:fixed;top:320px;left:250px;width:150px;height:40px;z-index:2020"><div id=box style="position:relative;width:100px;height:30px"><span id=field style="display:block;height:20px"></span></div></div>
<div id=ctx style="position:fixed;top:250px;left:0;width:40px;height:40px;z-index:3000"><span id=inner style="position:absolute;top:0;left:0;width:10px;height:10px"></span></div>
<div id=under style="position:relative;z-index:-1;height:20px"></div>
<script>
const at = (x, y) => { const e = document.elementFromPoint(x, y); return e ? e.id || e.nodeName : 'null'; };
console.log('dialog', at(150, 120), 'button', at(75, 80), 'backdrop', at(350, 250));
// visibility: hidden and pointer-events: none let clicks through, not
// their descendants that set them back
console.log('hidden', at(50, 250), at(10, 210), 'none', at(200, 250), at(160, 210));
// stacking contexts: positioned boxes in a fixed z-index header stay in
// it, over the backdrop; z-index -1 is under the flow
console.log('context', at(260, 325), at(5, 255), at(30, 280));
</script>
